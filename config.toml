[params]
    description = "Erik Ø. Sørensen is a professor of economics at NHH Norwegian School of Economics, working on experimental economics, social preferences, fairness, and research software. Personal website, CV and blog (Statsøkonomen)."

    [params.author]
    name = "Erik Ø. Sørensen"
    alternateNames = ["Erik Sørensen", "Erik O. Sorensen", "Erik Sorensen"]
    email = "erik.sorensen@nhh.no"
    jobTitle = "Professor of Economics"
    affiliation = "NHH Norwegian School of Economics"
    affiliationURL = "https://www.nhh.no/"
    sameAs = [
      "https://orcid.org/0000-0002-7155-4188",
      "https://scholar.google.com/citations?user=vV3i8C3IPygC",
      "https://github.com/ErikOSorensen",
    ]
    customCSS = ["css/custom-fonts.css", "css/print.css"]

    # options for highlight.js (version, additional languages, and theme)
    highlightjsVersion = "9.12.0"
    highlightjsCDN = "//cdnjs.cloudflare.com/ajax/libs"
    highlightjsLang = ["r", "yaml"]
    highlightjsTheme = "github"

    MathJaxCDN = "//cdnjs.cloudflare.com/ajax/libs"
    MathJaxVersion = "2.7.5"

    # path to the favicon, under "static"
    favicon = "Statsokonomen.ico"

    [params.logo]
    url = "Statsokonomen.png"
    width = 50
    height = 50
    alt = "Logo"

